<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동성로 쇼핑&뷰티 루트 2</title>
<style>
@font-face{font-family:"Galmuri11";src:url("Galmuri11.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Galmuri11";src:url("Galmuri11-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  /* layout: pixel-game world. sky backdrop, sign-board title, ROUTE / MISSION tabs, map stage, quest cards with stamp slots */
  --sky:#BFE4FA;
  --ink:#2B2350;
  --paper:#FFF9F0;
  --muted:#5E5684;
  --gold:#FFD66B;
  --theme:#E2557E;
  --font-pixel:"Galmuri11","DungGeunMo","Apple SD Gothic Neo","Noto Sans KR",monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sky);color:var(--ink);font-family:var(--font-pixel);font-size:15px;line-height:1.65}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:8px;height:8px;background:#fff}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:22px 16px 56px;display:flex;flex-direction:column;gap:18px}
.px{box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),4px 8px 0 0 rgba(43,35,80,.22)}
.sign{align-self:flex-start;position:relative;margin:22px 4px 4px;padding:14px 22px 12px;background:#FFEFC8}
.sign h1{font-size:36px;line-height:1.05;font-weight:700;letter-spacing:-1px;text-shadow:3px 3px 0 #fff}
.ribbon{display:inline-block;margin-top:10px;padding:2px 14px;background:var(--gold);font-weight:700;color:#2A4C9C;font-size:15px}
.sign .pin{position:absolute;top:-30px;left:24px}
.route-name{display:flex;flex-direction:column;gap:2px;background:var(--paper);padding:12px 14px;margin:4px}
.route-name b{font-size:21px;color:var(--theme);line-height:1.3}
.route-name span{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:4px}
.tab{appearance:none;border:0;background:#fff;font:inherit;color:var(--ink);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tab b{font-size:19px}
.tab small{font-size:12.5px;color:var(--muted)}
.tab[aria-selected="true"]{transform:translateY(3px);background:#FFF1C9}
.tab:focus-visible,.card:focus-visible,a:focus-visible,button:focus-visible,.mpin:focus-visible{outline:4px solid #FFB800;outline-offset:4px}
.stage{background:#F6E7D2;padding:6px;margin:4px}
svg#map{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.hud{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:4px}
.prog{background:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.bar{width:120px;height:14px;background:#E8E2F5;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);box-shadow:inset -3px 0 0 #E8B53C}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;color:#fff;text-decoration:none;font-size:14px;background:var(--theme);line-height:1.35}
.btn small{font-weight:400;font-size:12px;opacity:.9}
ol.quests{list-style:none;display:flex;flex-direction:column;gap:34px;padding:4px}
.card{position:relative;display:grid;grid-template-columns:1fr 92px;gap:12px;background:#fff;border:4px solid var(--c);border-radius:22px;padding:18px 14px 14px 16px;box-shadow:0 6px 0 0 color-mix(in srgb,var(--c) 35%,transparent)}
.card.bonus{border-style:dashed}
.card.active{background:color-mix(in srgb,var(--c) 8%,#fff)}
.card .tagpin{position:absolute;top:-26px;left:18px}
.card h3{display:flex;align-items:center;gap:8px;font-size:18px;line-height:1.3}
.card .en{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.chip{font-size:12px;padding:1px 8px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.card p{font-size:14px}
.card p.e{font-size:13px;color:var(--muted);margin-top:2px}
.addr .e{font-size:12px}
.addr{font-size:12.5px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:3px solid var(--c)}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.links a{font-size:13px;font-weight:700;color:var(--c)}
.phrase{margin-top:8px;padding:8px 10px;background:color-mix(in srgb,var(--c) 10%,#fff);border-left:4px solid var(--c);font-size:14px}
.phrase .ro{font-size:12.5px;color:var(--muted)}
.stamp{align-self:center;justify-self:end;width:86px;height:86px;border:3px dashed var(--c);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;font-size:11px;line-height:1.2;color:var(--c);text-align:center}
.stamp svg{width:38px;height:38px}
.stamp.on{border-style:solid;background:color-mix(in srgb,var(--c) 16%,#fff)}
.stamp.on .st{fill:currentColor}
.walk{font-size:13px;color:var(--muted);padding-left:22px;margin-top:12px}
.walk b{color:var(--theme)}
.badge{position:absolute;top:-14px;right:18px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;padding:1px 10px}
footer{background:var(--paper);padding:10px 14px;font-size:12.5px;margin:4px}
footer span{display:block;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){.sign h1{font-size:29px}.card{grid-template-columns:1fr 74px;padding:16px 12px 12px}.stamp{width:72px;height:72px}.stamp svg{width:30px;height:30px}.stage{padding:3px}.wrap{padding-left:12px;padding-right:12px}}
</style>
</head>

const line=document.getElementById('line');line.setAttribute('stroke',THEME);line.setAttribute('stroke-width',9*k);line.setAttribute('stroke-dasharray',`${18*k} ${12*k}`);line.setAttribute('points',stops.map(s=>s.x+','+s.y).join(' '));
if(alt){const a2=document.createElementNS(NS,'polyline');a2.setAttribute('fill','none');a2.setAttribute('stroke',THEME);a2.setAttribute('stroke-width',6*k);a2.setAttribute('stroke-dasharray',`${6*k} ${8*k}`);const p=stops[stops.length-2];a2.setAttribute('points',`${p.x},${p.y} ${alt.x},${alt.y}`);map.insertBefore(a2,document.getElementById('pins'))}
if(bonus){const b=document.getElementById('bline');b.setAttribute('stroke',BON);b.setAttribute('stroke-width',6*k);b.setAttribute('stroke-dasharray',`${6*k} ${8*k}`);const l=stops[stops.length-1];b.setAttribute('points',`${l.x},${l.y} ${bonus.x},${bonus.y}`)}
const PP=document.getElementById('pinpath').getAttribute('d');
const short=s=>{let t=s.ko.replace(/\s*\(.*\)/,'').split(' · ')[0].replace(' or ',' / ');if(t.includes(' ')){const p=t.split(' ');if(/점$/.test(p[p.length-1]))t=p[0];else if(t.length>8)t=p.pop()}return t};
const boxes=[];const pinsG=document.getElementById('pins');
function pin(s,i,color,label){const g=document.createElementNS(NS,'g');g.setAttribute('class','mpin');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',`${label}. ${s.ko}`);g.style.cursor='pointer';
 const t=short(s),fs=21*k,lw=(t.length*fs*.98)+26*k,lh=34*k;
 const ov=(cx,yy)=>boxes.some(b=>Math.abs(b.x-cx)<(b.w+lw)/2+4*k&&Math.abs(b.y-yy)<lh+4*k)||all.some(o=>Math.abs(o.x-cx)<lw/2+26*k&&yy<o.y+6*k&&yy+lh>o.y-70*k&&!(o===s&&yy>=s.y))||(o=>false)();
 const cands=[[s.x,s.y-60*k-lh],[s.x,s.y+12*k],[s.x+lw/2+30*k,s.y-50*k],[s.x-lw/2-30*k,s.y-50*k],[s.x,s.y-60*k-lh*2.2],[s.x,s.y+14*k+lh*1.2]];
 let [lx,ly]=cands.find(([cx,cy])=>!ov(cx,cy))||cands[0];boxes.push({x:lx,y:ly,w:lw,h:lh});
 g.innerHTML=`<rect x="${lx-lw/2}" y="${ly}" width="${lw}" height="${lh}" fill="#fff" stroke="${color}" stroke-width="${4*k}"/><text x="${lx}" y="${ly+lh*.7}" text-anchor="middle" font-size="${fs}" font-weight="700" font-family="Galmuri11, monospace" fill="#2B2350">${t}</text>
 <g transform="translate(${s.x-25*k} ${s.y-66*k}) scale(${3*k})"><path d="${PP}" fill="#2B2350"/><path d="${PP}" transform="translate(1 1) scale(.88)" fill="${color}"/><rect x="5" y="5" width="7" height="6" fill="#fff"/></g>
 <text x="${s.x}" y="${s.y-36*k}" text-anchor="middle" font-size="${18*k}" font-weight="700" font-family="Galmuri11, monospace" fill="${color}">${label}</text>`;
 g.addEventListener('click',()=>pick(i,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i,true)}});pinsG.appendChild(g)}
stops.forEach((s,i)=>pin(s.lat2?{...s,ko:'로힐'}:s,i,COL[i],String(i+1)));if(alt)pin(alt,alt.pi,COL[alt.pi],String(alt.pi+1));
{let nx0=x0,ny0=y0,nx1=x0+w,ny1=y0+h;boxes.forEach(b=>{nx0=Math.min(nx0,b.x-b.w/2-10*k);nx1=Math.max(nx1,b.x+b.w/2+10*k);ny0=Math.min(ny0,b.y-10*k);ny1=Math.max(ny1,b.y+b.h+10*k)});map.setAttribute('viewBox',`${nx0} ${ny0} ${nx1-nx0} ${ny1-ny0}`)}if(bonus)pin(bonus,4,BON,'+');
(function sky(){const s=document.getElementById('sky');[[6,9],[72,5],[84,30],[14,62],[90,74],[40,92]].forEach(([l,t])=>{const c=document.createElement('div');c.className='cloud';c.style.left=l+'%';c.style.top=t+'%';c.style.boxShadow='8px 0 0 #fff,16px 0 0 #fff,24px 0 0 #fff,32px 0 0 #fff,-8px 8px 0 #fff,0 8px 0 #fff,8px 8px 0 #fff,16px 8px 0 #fff,24px 8px 0 #fff,32px 8px 0 #fff,40px 8px 0 #fff,8px -8px 0 #fff,16px -8px 0 #fff,24px -8px 0 #fff,16px -16px 0 #fff';s.appendChild(c)})})();
const KEY='dsr-'+D.id;let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const star=`<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path class="st" d="M7 1h2v3h1v1h4v2h-1v1h-1v1h-1v2h1v3h-2v-1h-1v-1h-2v1h-1v1h-2v-3h1v-2h-1v-1h-1v-1h-1v-2h4v-1h1z" fill="none" stroke="currentColor" stroke-width="1"/></svg>`;
const shop=`<svg width="26" height="22" viewBox="0 0 13 11" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="4" width="11" height="7" fill="#2B2350"/><rect x="2" y="5" width="9" height="5" fill="#fff"/><rect x="5" y="7" width="3" height="3" fill="#7F94C9"/><rect x="0" y="1" width="13" height="4" fill="#2B2350"/><rect x="1" y="2" width="2" height="2" fill="#F0565E"/><rect x="3" y="2" width="2" height="2" fill="#fff"/><rect x="5" y="2" width="2" height="2" fill="#F0565E"/><rect x="7" y="2" width="2" height="2" fill="#fff"/><rect x="9" y="2" width="2" height="2" fill="#F0565E"/><rect x="11" y="2" width="1" height="2" fill="#fff"/></svg>`;
const tagpin=c=>`<svg class="tagpin" width="34" height="44" viewBox="0 0 17 22" shape-rendering="crispEdges" aria-hidden="true"><path d="${PP}" fill="#2B2350"/><path d="${PP}" transform="translate(1 1) scale(.88)" fill="${c}"/><rect x="5" y="5" width="7" height="6" fill="#fff"/></svg>`;

function stampBtn(key,label){const on=!!st[key];return `<button class="stamp${on?' on':''}" data-k="${key}" aria-pressed="${on}" aria-label="${label}">${star}<span>${on?'CLEAR!':'도장 찍기<br>Stamp'}</span></button>`}
function stopCard(s,i,isB){const c=isB?BON:COL[i];const links=s.url2?`<a href="${s.url}" target="_blank" rel="noopener">▶ 로힐 네이버 지도 · Rohill on Naver Map</a><a href="${s.url2}" target="_blank" rel="noopener">▶ 취록 네이버 지도 · Chwirok on Naver Map</a>`:`<a href="${s.url}" target="_blank" rel="noopener">▶ 네이버 지도에서 보기 · View on Naver Map</a>`;
 return `<div class="card${isB?' bonus':''}" id="c-${i}" style="--c:${c}">${tagpin(c)}${isB?'<span class="badge">BONUS · 선택</span>':''}
 <div><h3>${shop}${isB?'+':i+1}. ${s.ko}</h3><div class="en">${s.en}</div>
 <div class="row"><span class="chip">${s.hko}</span><span class="chip">${s.hen}</span></div>
 <p>${s.dko}</p><p class="e">${s.den}</p><div class="addr">${s.addr}<br><span class="e">${s.addr_en}</span></div><div class="links">${links}</div></div>${stampBtn('s'+i,s.ko+' 도장')}</div>`}
function render(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===view));
 const ol=document.getElementById('quests');ol.innerHTML='';
 if(view==='route'){stops.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML=stopCard(s,i,false)+(s.walk?`<div class="walk">▼ 걸어서 약 <b>${s.walk}분</b> · about ${s.walk} min walk</div>`:'');ol.appendChild(li)});
  if(bonus){const li=document.createElement('li');li.innerHTML=`<div class="walk" style="margin:-20px 0 22px">▼ 선택 코스 · optional, 약 <b>${bonus.walkFrom}분</b> · about ${bonus.walkFrom} min</div>`+stopCard(bonus,4,true);ol.appendChild(li)}}
 else{MIS.forEach((m,i)=>{const li=document.createElement('li');li.innerHTML=`<div class="card" style="--c:${COL[i]}">${tagpin(COL[i])}<div><h3>${i+1}. ${m.ko}</h3><div class="en">${m.en}</div><p style="margin-top:8px">${m.dko}</p><p class="e">${m.den}</p>
  <div class="phrase">“${m.p}”<div class="ro">${m.ro}</div><div class="ro">${m.pe}</div></div></div>${stampBtn('m'+i,m.ko+' 완료')}</div>`;ol.appendChild(li)})}
 ol.querySelectorAll('.stamp').forEach(b=>b.addEventListener('click',()=>{st[b.dataset.k]=!st[b.dataset.k];save();render()}));
 prog()}
function prog(){const pre=view==='route'?'s':'m',n=[0,1,2,3].filter(i=>st[pre+i]).length;document.getElementById('ptext').textContent=`${view==='route'?'STAMP':'MISSION'} ${n}/4`;document.getElementById('pbar').style.width=(n*25)+'%'}
function pick(i,scroll){if(view!=='route'){view='route';render()}document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));const c=document.getElementById('c-'+i);if(c){c.classList.add('active');if(scroll)c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{view=t.dataset.v;try{history.replaceState(null,'','#'+view)}catch(e){}render()}));
if(location.hash==='#mission')view='mission';
render();
</script>
